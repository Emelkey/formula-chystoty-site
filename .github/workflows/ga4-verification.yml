name: GA4 verification

on:
  pull_request:
    paths:
      - 'app/layout.tsx'
      - 'scripts/ga4-verification.mjs'
      - '.github/workflows/ga4-verification.yml'
  push:
    branches: [main]
    paths:
      - 'app/layout.tsx'
      - 'scripts/ga4-verification.mjs'
      - '.github/workflows/ga4-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-config:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ga4-verification.mjs

  verify-public-site:
    if: github.event_name != 'pull_request'
    needs: verify-config
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/ga4-browser" --ignore-scripts --no-package-lock playwright@1.55.1
          node "$RUNNER_TEMP/ga4-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Wait for the verified destination on the public site
        run: |
          node --input-type=module <<'NODE'
          import { setTimeout } from 'node:timers/promises';
          let ready = false;
          for (let attempt = 0; attempt < 18; attempt += 1) {
            try {
              const response = await fetch('https://www.formula-chistoty.ck.ua/?qa_tracking_ready=20260925', { cache: 'no-store', signal: AbortSignal.timeout(10000) });
              if (response.ok && (await response.text()).includes('gtag/js?id=G-E2Q1N11QWJ')) { ready = true; break; }
            } catch { /* Retry transient deployment propagation without changing the site. */ }
            await setTimeout(5000);
          }
          if (!ready) throw new Error('The verified GA4 destination is not yet present on the public site');
          console.log('The public site contains the expected Google tag loader');
          NODE
      - name: Verify public pages without submitting leads
        env:
          GA4_PLAYWRIGHT_DIR: ${{ runner.temp }}/ga4-browser
        run: node scripts/ga4-verification.mjs --live
      - name: Preserve non-identifying verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga4-production-verification
          path: outputs/ga4-browser/
          if-no-files-found: warn
          retention-days: 7
