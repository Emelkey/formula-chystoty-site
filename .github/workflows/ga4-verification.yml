name: GA4 verification

on:
  pull_request:
    paths:
      - 'app/layout.tsx'
      - 'lib/analytics.ts'
      - 'components/ContactForm.tsx'
      - 'scripts/ga4-verification.mjs'
      - '.github/workflows/ga4-verification.yml'
  push:
    branches: [main]
    paths:
      - 'app/layout.tsx'
      - 'lib/analytics.ts'
      - 'components/ContactForm.tsx'
      - 'scripts/ga4-verification.mjs'
      - '.github/workflows/ga4-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-config:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types scripts/ga4-verification.mjs

  verify-isolation:
    needs: verify-config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/ga4-browser" --ignore-scripts --no-package-lock playwright@1.55.1
          node "$RUNNER_TEMP/ga4-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify routing without delivering synthetic events
        env:
          GA4_PLAYWRIGHT_DIR: ${{ runner.temp }}/ga4-browser
        run: node --experimental-strip-types scripts/ga4-verification.mjs --sandbox
      - name: Wait for destination guard on the public site
        if: github.event_name != 'pull_request'
        run: |
          node --input-type=module <<'NODE'
          import { setTimeout } from 'node:timers/promises';
          let ready = false;
          for (let attempt = 0; attempt < 30; attempt += 1) {
            try {
              const response = await fetch('https://www.formula-chistoty.ck.ua/?qa_guard_ready=20260925', { cache: 'no-store', signal: AbortSignal.timeout(10000) });
              const text = await response.text();
              if (response.ok && text.includes('google-analytics-destination-guard') && text.includes('ga-disable-G-FNN4YK664L')) { ready = true; break; }
            } catch { /* Retry bounded deployment propagation. */ }
            await setTimeout(5000);
          }
          if (!ready) throw new Error('Destination guard has not reached the public site');
          console.log('Production guard is present');
          NODE
      - name: Verify live form and routing with intercepted telemetry and mocked API
        if: github.event_name != 'pull_request'
        env:
          GA4_PLAYWRIGHT_DIR: ${{ runner.temp }}/ga4-browser
        run: node --experimental-strip-types scripts/ga4-verification.mjs --live
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga4-destination-isolation
          path: outputs/ga4-browser/
          if-no-files-found: warn
          retention-days: 7
