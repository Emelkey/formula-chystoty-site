name: Seasonal entryway article QA
on:
  pull_request:
    paths:
      - 'lib/site.ts'
      - 'seo/query-map.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'eslint.config.mjs'
      - 'scripts/seo-architecture.test.mjs'
      - 'scripts/cms-smoke.sh'
      - 'scripts/minimatch-compatibility.test.mjs'
      - 'sanity.cli.ts'
      - 'components/BlogPostLayout.tsx'
      - 'components/ServiceCard.tsx'
      - 'scripts/seasonal-entryway-browser.mjs'
      - '.github/workflows/seasonal-entryway.yml'
  push:
    branches: [main]
    paths:
      - 'lib/site.ts'
      - 'seo/query-map.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'eslint.config.mjs'
      - 'scripts/seo-architecture.test.mjs'
      - 'scripts/cms-smoke.sh'
      - 'scripts/minimatch-compatibility.test.mjs'
      - 'sanity.cli.ts'
      - 'components/BlogPostLayout.tsx'
      - 'components/ServiceCard.tsx'
      - 'scripts/seasonal-entryway-browser.mjs'
      - '.github/workflows/seasonal-entryway.yml'
permissions:
  contents: read
jobs:
  article-browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.55.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:seo
      - name: Audit all installed dependencies
        run: pnpm audit
      - name: Verify scoped minimatch compatibility
        run: node --test scripts/minimatch-compatibility.test.mjs
      - name: Verify CMS schema and CLI without network access
        env:
          CMS_QA_OUTPUT: outputs/seasonal-entryway-cms
        run: bash scripts/cms-smoke.sh
      - name: Prepare isolated browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/article-browser" --ignore-scripts --no-package-lock playwright@1.55.1
          # Browsers and system libraries are preinstalled in the version-matched official image.
      - name: Start production build locally
        run: |
          pnpm start --hostname 127.0.0.1 --port 3141 > "$RUNNER_TEMP/article-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3141/blog > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/article-server.log"
          exit 1
      - name: Verify desktop and mobile article without leads or telemetry
        env:
          GA4_PLAYWRIGHT_DIR: ${{ runner.temp }}/article-browser
          ARTICLE_QA_OUTPUT: outputs/seasonal-entryway-local
        run: node scripts/seasonal-entryway-browser.mjs
      - name: Verify local forms with intercepted responses only
        env:
          GA4_PLAYWRIGHT_DIR: ${{ runner.temp }}/article-browser
          FORM_QA_BASE_URL: http://127.0.0.1:3141
          FORM_QA_OUTPUT: outputs/seasonal-entryway-forms
          FORM_QA_EXPECT_UX: '1'
        run: pnpm test:leads:browser
      - name: Await published article after merge
        if: github.event_name == 'push'
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS 'https://www.formula-chistoty.ck.ua/blog/yak-prybyraty-peredpokiy-voseny-ta-vzymku' | grep -q 'Правильна черга: вода, сухі частинки, потім миття'; then exit 0; fi
            sleep 10
          done
          echo 'The article was not served within the deployment verification window.'
          exit 1
      - name: Verify live article without leads or telemetry
        if: github.event_name == 'push'
        env:
          GA4_PLAYWRIGHT_DIR: ${{ runner.temp }}/article-browser
          ARTICLE_QA_BASE_URL: https://www.formula-chistoty.ck.ua
          ARTICLE_QA_OUTPUT: outputs/seasonal-entryway-production
        run: node scripts/seasonal-entryway-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seasonal-entryway-qa
          path: outputs/seasonal-entryway-*
          retention-days: 7
