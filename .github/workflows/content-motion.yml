name: Accessible content motion QA
on:
  pull_request:
    paths:
      - 'components/**'
      - 'app/globals.css'
      - 'scripts/*motion*'
      - '.github/workflows/content-motion.yml'
  push:
    branches: [main]
    paths:
      - 'components/**'
      - 'app/globals.css'
      - 'scripts/*motion*'
      - '.github/workflows/content-motion.yml'
permissions:
  contents: read
jobs:
  motion:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.55.1-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test:seo
      - run: pnpm build
      - run: node --test scripts/button-motion.test.mjs scripts/contact-bundle.test.mjs
      - name: Isolated browsers
        run: npm install --prefix "$RUNNER_TEMP/motion-browser" --ignore-scripts --no-package-lock playwright@1.55.1
      - name: Start built server
        run: |
          pnpm start --hostname 127.0.0.1 --port 3100 > "$RUNNER_TEMP/motion-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/motion-server.log"
          exit 1
      - name: Verify desktop, touch, keyboard, reduced motion and no JavaScript
        env:
          GA4_PLAYWRIGHT_DIR: ${{ runner.temp }}/motion-browser
        run: |
          node scripts/motion-layout-browser.mjs
          node scripts/content-motion-browser.mjs
      - name: Measure new build
        env:
          GA4_PLAYWRIGHT_DIR: ${{ runner.temp }}/motion-browser
          OUTPUT: outputs/motion-after-local
        run: node scripts/motion-performance.mjs
      - name: Checkout baseline for like-for-like local speed comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .baseline
          persist-credentials: false
      - name: Build baseline and compare
        if: github.event_name == 'pull_request'
        env:
          GA4_PLAYWRIGHT_DIR: ${{ runner.temp }}/motion-browser
          BASE_URL: http://127.0.0.1:3101
          OUTPUT: outputs/motion-before-local
        run: |
          (cd .baseline && pnpm install --frozen-lockfile && pnpm build)
          (cd .baseline && pnpm start --hostname 127.0.0.1 --port 3101) > "$RUNNER_TEMP/motion-baseline.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3101/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/motion-performance.mjs
      - name: Capture public baseline before release
        if: github.event_name == 'pull_request'
        env:
          GA4_PLAYWRIGHT_DIR: ${{ runner.temp }}/motion-browser
          BASE_URL: https://www.formula-chistoty.ck.ua
          OUTPUT: outputs/motion-before-production
        run: node scripts/motion-performance.mjs
      - name: Wait for released motion markup
        if: github.event_name == 'push'
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS https://www.formula-chistoty.ck.ua/ | grep -q 'floating-contact-desktop'; then exit 0; fi
            sleep 10
          done
          echo 'Release was not served in the 10-minute propagation window.'
          exit 1
      - name: Verify released layout and speed without telemetry or leads
        if: github.event_name == 'push'
        env:
          GA4_PLAYWRIGHT_DIR: ${{ runner.temp }}/motion-browser
          MOTION_QA_BASE_URL: https://www.formula-chistoty.ck.ua
          MOTION_QA_OUTPUT: outputs/motion-layout-production
          BASE_URL: https://www.formula-chistoty.ck.ua
          OUTPUT: outputs/motion-after-production
        run: |
          node scripts/motion-layout-browser.mjs
          node scripts/motion-performance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessible-motion-evidence
          path: outputs/
          retention-days: 14
