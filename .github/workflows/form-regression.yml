name: Form browser regression
on:
  pull_request:
    paths:
      - 'app/globals.css'
      - 'components/Header.tsx'
      - 'components/ButtonSpringFeedback.tsx'
      - 'components/HeroSection.tsx'
      - 'components/FloatingContactButtons.tsx'
      - 'scripts/button-motion.test.mjs'
      - 'scripts/button-motion-browser.mjs'
      - 'components/ContactForm.tsx'
      - 'app/kontakty/page.tsx'
      - 'scripts/contact-identifiers-browser.mjs'
      - 'scripts/contact-links-browser.mjs'
      - 'components/ServicePageLayout.tsx'
      - 'lib/site.ts'
      - 'components/Buttons.tsx'
      - 'components/TrackedLink.tsx'
      - 'lib/analytics.ts'
      - 'lib/phone.ts'
      - 'app/api/lead/route.ts'
      - 'app/layout.tsx'
      - 'scripts/form-browser-verification.mjs'
      - '.github/workflows/form-regression.yml'
  push:
    branches: [main]
    paths:
      - 'app/globals.css'
      - 'components/Header.tsx'
      - 'components/ButtonSpringFeedback.tsx'
      - 'components/HeroSection.tsx'
      - 'components/FloatingContactButtons.tsx'
      - 'scripts/button-motion.test.mjs'
      - 'scripts/button-motion-browser.mjs'
      - 'components/ContactForm.tsx'
      - 'app/kontakty/page.tsx'
      - 'scripts/contact-identifiers-browser.mjs'
      - 'scripts/contact-links-browser.mjs'
      - 'components/ServicePageLayout.tsx'
      - 'lib/site.ts'
      - 'lib/analytics.ts'
      - 'lib/phone.ts'
      - 'app/api/lead/route.ts'
      - 'app/layout.tsx'
      - 'scripts/form-browser-verification.mjs'
      - '.github/workflows/form-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.55.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:seo
      - run: pnpm audit
      - name: Prepare isolated browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/form-browser" --ignore-scripts --no-package-lock playwright@1.55.1
          # Matching official image provides browsers and OS dependencies.
      - name: Start production server
        run: |
          pnpm start --hostname 127.0.0.1 --port 3100 > "$RUNNER_TEMP/form-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/kontakty > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/form-server.log"
          exit 1
      - name: Verify hydrated forms without sending leads or telemetry
        env:
          GA4_PLAYWRIGHT_DIR: ${{ runner.temp }}/form-browser
          FORM_QA_EXPECT_UX: '1'
        run: pnpm test:leads:browser
      - name: Verify both contact form identifiers and independent states
        env:
          GA4_PLAYWRIGHT_DIR: ${{ runner.temp }}/form-browser
        run: node scripts/contact-identifiers-browser.mjs
      - name: Verify contextual links and Back navigation
        env:
          GA4_PLAYWRIGHT_DIR: ${{ runner.temp }}/form-browser
        run: node scripts/contact-links-browser.mjs
      - name: Verify spring feedback, desktop and mobile behavior
        env:
          GA4_PLAYWRIGHT_DIR: ${{ runner.temp }}/form-browser
        run: |
          node --test scripts/button-motion.test.mjs
          node scripts/button-motion-browser.mjs
      - name: Await published unique contact identifiers
        if: github.event_name == 'push'
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS 'https://www.formula-chistoty.ck.ua/kontakty' | grep -q 'id="contact-estimate-form"'; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Verify live identifiers and contextual navigation without submissions
        if: github.event_name == 'push'
        env:
          GA4_PLAYWRIGHT_DIR: ${{ runner.temp }}/form-browser
          CONTACT_LINK_QA_BASE_URL: https://www.formula-chistoty.ck.ua
          CONTACT_LINK_QA_OUTPUT: outputs/contact-links-production
        run: node scripts/contact-links-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: form-browser-regression
          path: |
            outputs/form-browser/
            outputs/button-motion/
            outputs/contact-identifiers/
            outputs/contact-links*/
          retention-days: 7
