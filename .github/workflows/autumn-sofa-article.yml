name: Autumn sofa article QA
on:
  pull_request:
    paths:
      - 'lib/site.ts'
      - 'components/BlogPostLayout.tsx'
      - 'scripts/autumn-sofa-browser.mjs'
      - '.github/workflows/autumn-sofa-article.yml'
  push:
    branches: [main]
    paths:
      - 'lib/site.ts'
      - 'components/BlogPostLayout.tsx'
      - 'scripts/autumn-sofa-browser.mjs'
      - '.github/workflows/autumn-sofa-article.yml'
permissions:
  contents: read
jobs:
  article-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prepare isolated browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/article-browser" --ignore-scripts --no-package-lock playwright@1.55.1
          node "$RUNNER_TEMP/article-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Start production build locally
        run: |
          pnpm start --hostname 127.0.0.1 --port 3141 > "$RUNNER_TEMP/article-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3141/blog > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/article-server.log"
          exit 1
      - name: Verify desktop and mobile article without leads or telemetry
        env:
          GA4_PLAYWRIGHT_DIR: ${{ runner.temp }}/article-browser
          ARTICLE_QA_OUTPUT: outputs/autumn-sofa-local
        run: node scripts/autumn-sofa-browser.mjs
      - name: Await published article after merge
        if: github.event_name == 'push'
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS 'https://www.formula-chistoty.ck.ua/blog/himchystka-dyvana-voseny-skilky-sohne' | grep -q 'Плануєте хімчистку дивана цієї осені'; then exit 0; fi
            sleep 10
          done
          echo 'The article was not served within the deployment verification window.'
          exit 1
      - name: Verify live article without leads or telemetry
        if: github.event_name == 'push'
        env:
          GA4_PLAYWRIGHT_DIR: ${{ runner.temp }}/article-browser
          ARTICLE_QA_BASE_URL: https://www.formula-chistoty.ck.ua
          ARTICLE_QA_OUTPUT: outputs/autumn-sofa-production
        run: node scripts/autumn-sofa-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autumn-sofa-article-qa
          path: outputs/autumn-sofa-*
          retention-days: 7
