name: GA4 destination diagnostic

on:
  push:
    branches: ['diagnostic/ga4-destinations-2026-09-25']

permissions:
  contents: read

jobs:
  inspect-public-tags:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect public tag IDs without executing JavaScript
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const ids = ['G-E2Q1N11QWJ', 'G-FNN4YK664L'];
          const result = { checkedAt: new Date().toISOString(), mode: 'public-GET-only-no-JS-execution', analyticsEventsSent: 0, tags: [] };
          for (const id of ids) {
            try {
              const response = await fetch(`https://www.googletagmanager.com/gtag/js?id=${id}`, { signal: AbortSignal.timeout(20000) });
              const body = await response.text();
              const contexts = {};
              for (const target of ids) {
                contexts[target] = [];
                let index = body.indexOf(target);
                while (index >= 0 && contexts[target].length < 3) {
                  contexts[target].push(body.slice(Math.max(0, index - 90), index + target.length + 110));
                  index = body.indexOf(target, index + target.length);
                }
              }
              result.tags.push({ requestedId: id, httpStatus: response.status, sha256: createHash('sha256').update(body).digest('hex'), observedGoogleIds: [...new Set(body.match(/\b(?:G|GT|GTM|AW)-[A-Z0-9]+\b/g) || [])].slice(0, 30), contexts });
            } catch (error) { result.tags.push({ requestedId: id, error: String(error.message) }); }
          }
          try {
            const response = await fetch('https://www.formula-chistoty.ck.ua/?qa_tag_inspection=20260925', { signal: AbortSignal.timeout(20000) });
            const html = await response.text();
            result.site = { httpStatus: response.status, observedGoogleIds: [...new Set(html.match(/\b(?:G|GT|GTM|AW)-[A-Z0-9]+\b/g) || [])].slice(0, 30) };
          } catch (error) { result.site = { error: String(error.message) }; }
          mkdirSync('ga4-destination-diagnostic', { recursive: true });
          writeFileSync('ga4-destination-diagnostic/receipt.json', JSON.stringify(result, null, 2));
          console.log(JSON.stringify(result, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: ga4-destination-diagnostic
          path: ga4-destination-diagnostic/
          retention-days: 7
